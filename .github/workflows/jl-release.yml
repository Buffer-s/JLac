name: Build JL for Windows

# Builds JL.exe on a real Windows runner and attaches it to a GitHub Release.
#
# Triggers:
#   * push a tag like v0.0.1            -> builds and publishes a release
#   * "Run workflow" from the Actions   -> builds a portable zip artifact only
#
# No secrets or signing certificates are required: the portable build is a plain
# zip of the install tree, produced by tools/jlac/package-portable.ps1.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      BUILD_TYPE: Release
      CMAKE_PRESET: ci
      BUILD_PLATFORM: official
      ARTIFACT_NAME: Windows-MSVC

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.11.2

      - name: Cache vcpkg
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/cmake/vcpkg/installed
          key: jl-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: jl-vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset "$env:CMAKE_PRESET" -D VCPKG_HOST_TRIPLET=x64-windows -D VCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build --preset "$env:CMAKE_PRESET" --config Release

      - name: Collect portable build
        shell: pwsh
        run: pwsh -NoProfile -File tools/jlac/package-portable.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "out/JL.exe")) { Write-Host "::error::JL.exe missing"; exit 1 }
          if (-not (Test-Path "out/JL-Windows-x64.zip")) { Write-Host "::error::portable zip missing"; exit 1 }
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: JL-Windows-x64
          path: |
            out/JL-Windows-x64.zip
            out/JL.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: JL ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # The standalone exe is the file most people want; the zip is the
          # complete portable install (Qt DLLs + plugins included).
          files: |
            out/JL.exe
            out/JL-Windows-x64.zip
